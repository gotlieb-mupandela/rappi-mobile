name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  guard:
    name: Check production branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse production builds that are not on main
        if: inputs.profile == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production builds only run on the main branch. This run is on ${GITHUB_REF}."
          echo "Dispatch the production profile from main, or choose preview."
          exit 1

  build:
    name: Build Android
    needs: guard
    runs-on: ubuntu-latest
    # Preview leaves the name empty, so this job does not use an environment.
    # Production uses the production environment so required reviewers can gate it.
    environment: ${{ inputs.profile == 'production' && 'production' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8 (8.2.1)
        with:
          eas-version: 25.3.0

      - name: Install dependencies
        run: npm ci

      - name: Build Android on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_PROFILE: ${{ inputs.profile }}
        run: eas build --platform android --profile "$EAS_BUILD_PROFILE" --non-interactive --no-wait
